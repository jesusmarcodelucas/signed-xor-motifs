[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signed-xor-motif-validation"
version = "1.0.0"
description = "Functional (spiking) validation of the signed-XOR neuronal motif with mouse-cortex (Allen V1) cell types."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC-BY-NC-4.0" }
authors = [{ name = "Jesús Marco de Lucas", email = "jesus.marco@csic.es" }]
keywords = ["spiking neural network", "signed XOR", "parvalbumin", "local error", "Allen V1"]
dependencies = [
    "brian2>=2.7",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["signed_xor"]
